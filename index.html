<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="ONG Esperança - projetos sociais, voluntariado e doações." />
  <title>ONG Esperança</title>
  <link rel="stylesheet" href="/src/css/style.css" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11" defer></script>
</head>
<body>
  <a class="skip-link" href="#conteudo">Pular para o conteúdo</a>

    <a class="marca" href="#inicio" data-route="inicio" aria-label="ONG Esperança - página inicial">ONG Esperança</a>
